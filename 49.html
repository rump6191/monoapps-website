<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Acrylic</title>
    <style>
        body { margin: 0; height: 100vh; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .bg-blobs { position: absolute; width: 100%; height: 100%; }
        .blob { position: absolute; width: 400px; height: 400px; border-radius: 50%; filter: blur(80px); }
        .b1 { background: #ff0055; top: -100px; left: -100px; animation: move 10s infinite alternate; }
        .b2 { background: #00f3ff; bottom: -100px; right: -100px; animation: move 12s infinite alternate-reverse; }
        @keyframes move { from { transform: translate(0,0); } to { transform: translate(200px, 100px); } }
        
        .acrylic-card {
            width: 500px; padding: 60px; background: rgba(255,255,255,0.05); backdrop-filter: blur(40px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; text-align: center; color: white;
            box-shadow: 0 40px 100px rgba(0,0,0,0.5); font-family: system-ui, sans-serif;
        }
        h1 { font-size: 3.5rem; font-weight: 800; margin: 0 0 20px; }
        .btn-glass { display: inline-block; padding: 15px 40px; background: white; color: black; border-radius: 100px; text-decoration: none; font-weight: 700; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>
    <div class="acrylic-card">
        <h1>Vividly Clear.</h1>
        <p>MonoApps: Designing tools with absolute clarity and precision.</p>
        <a href="#" class="btn-glass">Enter Experience</a>
    </div>
</body>
</html>
