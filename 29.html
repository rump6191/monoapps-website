<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Pixel Art</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #222; font-family: 'Press Start 2P', cursive; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; image-rendering: pixelated; }
        .screen { background: #000; border: 8px solid #555; padding: 40px; box-shadow: 0 0 0 8px #222, 0 0 0 16px #555; }
        h1 { font-size: 2rem; color: #0f0; margin-bottom: 40px; text-shadow: 4px 4px #005500; }
        .menu { display: flex; flex-direction: column; gap: 20px; }
        .menu-item { cursor: pointer; color: #fff; text-decoration: none; }
        .menu-item:hover { color: #ff0; }
        .cursor { display: inline-block; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="screen">
        <h1>MONOAPPS v1.0</h1>
        <div class="menu">
            <a href="#" class="menu-item">> START_QR_SCANNER</a>
            <a href="#" class="menu-item">> LOAD_DREAM_TELLER</a>
            <a href="#" class="menu-item">> QUIT</a>
        </div>
        <p style="margin-top:40px; font-size:0.5rem; color:#555;">(C) 2026 MONOAPPS CORP.<span class="cursor">_</span></p>
    </div>
</body>
</html>
