<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Isometric</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; min-height: 100vh; background: #2d3436; color: white;
            font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        
        .iso-container {
            position: relative; transform: rotateX(55deg) rotateZ(-45deg) translate(-50px, -50px);
            transform-style: preserve-3d; transition: 0.5s;
        }
        
        .card {
            width: 300px; height: 180px; background: #fff; margin-bottom: 20px; border-radius: 20px;
            position: relative; transition: 0.3s; box-shadow: 20px 20px 20px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #333;
            transform-style: preserve-3d;
        }
        
        .card:hover { transform: translate(0, -20px); box-shadow: 30px 30px 30px rgba(0,0,0,0.3); background: #6c5ce7; color: white; }
        
        .card::before {
            content: ''; position: absolute; top: 0; left: -10px; width: 10px; height: 100%;
            background: #dfe6e9; transform: skewY(-45deg); transform-origin: right; transition: 0.3s;
        }
        .card:hover::before { background: #a29bfe; }
        
        .card::after {
            content: ''; position: absolute; bottom: -10px; left: 0; width: 100%; height: 10px;
            background: #b2bec3; transform: skewX(-45deg); transform-origin: top; transition: 0.3s;
        }
        .card:hover::after { background: #6c5ce7; }
        
        .layer { position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; border-radius: 20px; background: transparent; z-index: -1; }
        
        h1 { position: absolute; top: -150px; left: 0; font-size: 4rem; color: white; text-shadow: 4px 4px 0 #000; pointer-events: none; transform: translateZ(50px); }
        
        h3 { font-size: 1.5rem; margin: 0; font-weight: 800; }
        p { font-size: 0.9rem; margin: 5px 0 0; opacity: 0.8; }
        
        .bg-pattern {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: radial-gradient(#636e72 1px, transparent 1px); background-size: 40px 40px; z-index: -1;
            transform: rotateX(55deg) rotateZ(-45deg); opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    
    <div class="iso-container">
        <h1>MonoApps<br>Dimension</h1>
        
        <div class="card" style="z-index: 3;">
            <h3>QR Scanner</h3>
            <p>Fastest Scan Engine</p>
        </div>
        
        <div class="card" style="z-index: 2; margin-left: 60px;">
            <h3>21 Innovation</h3>
            <p>Smart Shopping Data</p>
        </div>
        
        <div class="card" style="z-index: 1; margin-left: 120px;">
            <h3>Dream Teller</h3>
            <p>Subconscious AI</p>
        </div>
    </div>
    
    <div style="position: fixed; bottom: 30px; right: 30px; text-align: right;">
        <h2 style="margin: 0;">3D VIEW</h2>
        <p>Interactive Layout</p>
    </div>
</body>
</html>
