<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Dark Neu</title>
    <style>
        body { margin: 0; background: #2d2d2d; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .card { width: 300px; padding: 40px; border-radius: 20px; background: #2d2d2d; box-shadow:  20px 20px 60px #262626, -20px -20px 60px #343434; text-align: center; color: #888; }
        .btn { display: inline-block; padding: 15px 30px; border-radius: 50px; background: #2d2d2d; box-shadow:  8px 8px 16px #262626, -8px -8px 16px #343434; color: #00f; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .btn:active { box-shadow: inset 8px 8px 16px #262626, inset -8px -8px 16px #343434; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Dark Mode</h1>
        <p>Soft shadows in the dark.</p>
        <a href="#" class="btn">Touch Me</a>
    </div>
</body>
</html>
