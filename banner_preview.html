<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonoApps YouTube Banner Concepts</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            gap: 40px;
        }

        h1 {
            font-weight: 300;
            opacity: 0.7;
        }

        .banner-container {
            width: 100%;
            max-width: 1280px;
            /* Half of 2560 for viewing */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .banner-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            /* Aspect ratio 16:9 for the whole container, though banners are wider */
            padding-top: 33.33%;
            /* Adjusting for a more banner-like aspect ratio view */
        }

        .banner-wrapper {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            background: #222;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .label {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.5;
            text-align: center;
        }

        /* Overlay to show "Safe Area" for mobile/desktop text */
        .safe-area-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.2;
            border: 1px dashed cyan;
        }

        .safe-area-box {
            width: 60%;
            /* Approx safe area width relative to full width */
            height: 30%;
            /* Approx safe area height */
            border: 1px dashed yellow;
            display: flex;
            align-items: center;
            justify-content: center;
            color: yellow;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h1>MonoApps Banner Concepts (2560x1440)</h1>
    <div class="banner-container">

        <!-- Banner 1: Minimalist Swiss Style -->
        <div class="banner-wrapper">
            <svg viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
                <!-- Background -->
                <rect width="2560" height="1440" fill="#111" />

                <!-- Decorative Elements -->
                <circle cx="200" cy="200" r="300" fill="#1a1a1a" />
                <circle cx="2300" cy="1200" r="400" fill="#1a1a1a" />

                <!-- Central Composition (Safe Area) -->
                <g transform="translate(1280, 720)">
                    <!-- Text -->
                    <text x="0" y="0" font-family="Arial, sans-serif" font-weight="900" font-size="200" fill="#fff"
                        text-anchor="middle" dominant-baseline="middle" letter-spacing="-5">MONOAPPS</text>
                    <text x="0" y="160" font-family="Arial, sans-serif" font-weight="400" font-size="40" fill="#888"
                        text-anchor="middle" letter-spacing="10">CREATE . CODE . CONNECT</text>

                    <!-- Red Dot Accent (from Option 15) -->
                    <circle cx="620" cy="-20" r="40" fill="#FF3B30" />
                </g>
            </svg>
        </div>
        <div class="label">Option 1: Minimalist Swiss (Matches Logo Option 15)</div>


        <!-- Banner 2: Tech Gradient Flow -->
        <div class="banner-wrapper">
            <svg viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#302b63;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
                    </linearGradient>
                    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#00f260;stop-opacity:0" />
                        <stop offset="50%" style="stop-color:#0575e6;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#00f260;stop-opacity:0" />
                    </linearGradient>
                </defs>

                <!-- Background -->
                <rect width="2560" height="1440" fill="url(#bg-grad)" />

                <!-- Abstract Tech Lines -->
                <path d="M-100 800 Q 640 600 1280 800 T 2660 800" fill="none" stroke="url(#line-grad)" stroke-width="4"
                    opacity="0.5" />
                <path d="M-100 850 Q 640 650 1280 850 T 2660 850" fill="none" stroke="url(#line-grad)" stroke-width="4"
                    opacity="0.3" />
                <path d="M-100 750 Q 640 550 1280 750 T 2660 750" fill="none" stroke="url(#line-grad)" stroke-width="4"
                    opacity="0.3" />

                <!-- Center Content -->
                <g transform="translate(1280, 720)">
                    <text x="0" y="20" font-family="Inter, sans-serif" font-weight="800" font-size="180" fill="#fff"
                        text-anchor="middle">monoapps.kr</text>
                    <rect x="-150" y="100" width="300" height="4" fill="url(#line-grad)" />
                    <text x="0" y="160" font-family="monospace" font-size="40" fill="#4facfe"
                        text-anchor="middle">&lt;coding_the_future /&gt;</text>
                </g>
            </svg>
        </div>
        <div class="label">Option 2: Dark Tech & Code</div>


        <!-- Banner 3: Vibrant Creative -->
        <div class="banner-wrapper">
            <svg viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="grad-overlay" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ee7752;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#e73c7e;stop-opacity:0.8" />
                    </linearGradient>
                    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1" opacity="0.05" />
                    </pattern>
                </defs>

                <!-- Background Image Placeholder (Abstract Shapes) -->
                <rect width="2560" height="1440" fill="#111" />
                <rect width="2560" height="1440" fill="url(#grid)" />

                <!-- Big abstract M shape in background -->
                <path d="M-200 1440 L 800 0 L 1800 1440" fill="url(#grad-overlay)" opacity="0.1" />
                <path d="M800 1440 L 1800 0 L 2800 1440" fill="url(#grad-overlay)" opacity="0.1" />

                <!-- Floating Elements -->
                <circle cx="400" cy="400" r="50" fill="none" stroke="#fff" stroke-width="4" opacity="0.2" />
                <rect x="2000" y="800" width="100" height="100" fill="none" stroke="#fff" stroke-width="4" opacity="0.2"
                    transform="rotate(45 2050 850)" />

                <!-- Main Text -->
                <g transform="translate(1280, 720)">
                    <text x="0" y="0" font-family="Inter, sans-serif" font-weight="900" font-size="220"
                        fill="transparent" stroke="white" stroke-width="4" text-anchor="middle"
                        dominant-baseline="middle">MONOAPPS</text>
                    <text x="4" y="4" font-family="Inter, sans-serif" font-weight="900" font-size="220" fill="white"
                        text-anchor="middle" dominant-baseline="middle" opacity="0.9">MONOAPPS</text>
                    <text x="0" y="160" font-family="Inter, sans-serif" font-weight="500" font-size="50" fill="#fff"
                        text-anchor="middle" letter-spacing="4" text-transform="uppercase">App Development &
                        Design</text>
                </g>
            </svg>
        </div>
        <div class="label">Option 3: Vibrant Creative Studio</div>

    </div>
</body>

</html>
