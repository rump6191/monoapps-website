<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Glass 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .bg-gradient { position: fixed; width: 150vw; height: 150vh; background: conic-gradient(from 180deg at 50% 50%, #ee7752, #e73c7e, #23a6d5, #23d5ab); filter: blur(100px); animation: rotate 20s linear infinite; z-index: -1; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .glass-box { width: 80%; max-width: 1000px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 40px; padding: 60px; color: white; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
        h1 { font-size: 4rem; margin: 0 0 20px; letter-spacing: -2px; }
        p { font-size: 1.2rem; opacity: 0.8; line-height: 1.6; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .card { background: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.3s; }
        .card:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="glass-box">
        <h1>Glass<br>Innovation.</h1>
        <p>투명하고 명확한 가치를 담습니다. MonoApps의 새로운 글래스모피즘 인터페이스.</p>
        <div class="grid">
            <div class="card"><h3>QR Pro</h3><p>Fast Scanner</p></div>
            <div class="card"><h3>21 Innov</h3><p>Market Data</p></div>
            <div class="card"><h3>Dream AI</h3><p>Subconscious</p></div>
        </div>
    </div>
</body>
</html>
