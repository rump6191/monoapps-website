<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Typographic</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #fff; font-family: 'Anton', sans-serif; overflow: hidden; }
        .poster { height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 40px; box-sizing: border-box; }
        .big-text { font-size: 18vw; line-height: 0.8; text-transform: uppercase; color: #000; letter-spacing: -5px; }
        .footer { display: flex; justify-content: space-between; font-family: sans-serif; font-weight: bold; border-top: 5px solid #000; padding-top: 20px; }
        .link { color: #fff; background: #000; padding: 10px 20px; text-decoration: none; transition: 0.3s; }
        .link:hover { background: #ff0055; }
    </style>
</head>
<body>
    <div class="poster">
        <div class="big-text">PURE<br>UTILITY<br>ONLY.</div>
        <div class="footer">
            <div>MONOAPPS® 2026</div>
            <div style="display:flex; gap:20px;">
                <a href="#" class="link">SCANNER</a>
                <a href="#" class="link">INNOVATION</a>
            </div>
        </div>
    </div>
</body>
</html>
