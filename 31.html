<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Neo Memphis</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #fff; font-family: 'Montserrat', sans-serif; overflow: hidden; }
        .dot-bg { position: fixed; width: 100%; height: 100%; background-image: radial-gradient(#000 2px, transparent 2px); background-size: 30px 30px; opacity: 0.1; z-index: -1; }
        .shape { position: absolute; border: 4px solid #000; }
        .circle { border-radius: 50%; background: #ff0055; width: 200px; height: 200px; top: -50px; left: -50px; }
        .triangle { width: 0; height: 0; border-left: 100px solid transparent; border-right: 100px solid transparent; border-bottom: 150px solid #00f3ff; position: absolute; right: 10%; top: 20%; transform: rotate(15deg); }
        .container { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        h1 { font-size: 10vw; text-transform: uppercase; background: #ffea00; color: #000; padding: 0 20px; border: 5px solid #000; box-shadow: 15px 15px 0 #000; }
    </style>
</head>
<body>
    <div class="dot-bg"></div>
    <div class="shape circle"></div>
    <div class="shape triangle"></div>
    <div class="container">
        <h1>MONOAPPS</h1>
    </div>
</body>
</html>
