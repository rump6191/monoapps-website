<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Synthwave</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --purple: #240b36; --pink: #c31432; --neon: #00f3ff; --magenta: #ff00ff; }
        body { margin: 0; background: var(--purple); color: #fff; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100vh; }
        
        /* Sun */
        .sun {
            position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
            width: 400px; height: 400px; border-radius: 50%;
            background: linear-gradient(to bottom, #ff9d00 0%, #ff0055 50%, transparent 100%);
            box-shadow: 0 0 50px #ff0055; z-index: -1;
        }

        /* Grid Floor */
        .grid-floor {
            position: absolute; bottom: 0; width: 100%; height: 50%;
            background-image: 
                linear-gradient(transparent 0%, var(--magenta) 2%, transparent 3%),
                linear-gradient(90deg, transparent 0%, var(--magenta) 2%, transparent 3%);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: top;
            animation: grid-move 2s linear infinite;
            z-index: -1; opacity: 0.5;
        }
        @keyframes grid-move { 0% { background-position: 0 0; } 100% { background-position: 0 50px; } }

        .container { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        
        h1 { font-size: 5rem; text-transform: uppercase; margin: 0; letter-spacing: 10px; text-shadow: 3px 3px 0 var(--magenta), -3px -3px 0 var(--neon); }
        p { font-size: 1.2rem; margin: 20px 0 40px; color: var(--neon); text-transform: uppercase; letter-spacing: 2px; }

        .nav-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 900px; width: 100%; }
        .cyber-card {
            background: rgba(0,0,0,0.6); border: 1px solid var(--neon); padding: 20px; transition: 0.3s;
            box-shadow: 0 0 10px var(--neon);
        }
        .cyber-card:hover { transform: translateY(-10px); background: var(--neon); color: #000; box-shadow: 0 0 30px var(--neon); }
        .cyber-card h3 { margin: 0 0 10px; font-size: 1.2rem; }
        .cyber-card p { font-size: 0.8rem; margin: 0; color: inherit; letter-spacing: 0; }
    </style>
</head>
<body>
    <div class="sun"></div>
    <div class="grid-floor"></div>

    <div class="container">
        <h1>MONOAPPS</h1>
        <p>Welcome to the retro future. Digital excellence since 2026.</p>
        
        <div class="nav-grid">
            <div class="cyber-card">
                <h3>QR SCAN</h3>
                <p>Execute scanning protocol. High speed interface.</p>
            </div>
            <div class="cyber-card">
                <h3>INNOVATE</h3>
                <p>Access product analysis database 2.1.</p>
            </div>
            <div class="cyber-card">
                <h3>DREAMS</h3>
                <p>Decode subconscious memory banks.</p>
            </div>
        </div>
    </div>
</body>
</html>
