<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Liquid</title>
    <style>
        body { margin: 0; background: #6366f1; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .liquid { position: relative; width: 400px; height: 400px; background: #fff; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; animation: morph 6s linear infinite; }
        @keyframes morph { 0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; } 33% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; } 66% { border-radius: 50% 50% 30% 70% / 50% 70% 30% 50%; } }
        h1 { font-family: sans-serif; font-size: 3rem; color: #6366f1; z-index: 10; }
    </style>
</head>
<body>
    <div class="liquid"></div>
    <h1 style="position:absolute;">MonoApps</h1>
</body>
</html>
