<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Noir</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,900&family=Inter:wght@300;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #080808; color: #fff; font-family: 'Inter', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .bg-shadow { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at 30% 30%, #1a1a1a 0%, #080808 100%); z-index: -1; }
        .content { text-align: center; max-width: 800px; }
        h1 { font-family: 'Playfair Display', serif; font-size: 8rem; font-style: italic; line-height: 0.8; margin: 0; text-shadow: 20px 20px 50px rgba(0,0,0,0.5); animation: reveal 1.5s cubic-bezier(0.77, 0, 0.175, 1); }
        @keyframes reveal { from { opacity: 0; transform: translateY(50px) skewY(5deg); } to { opacity: 1; transform: translateY(0) skewY(0); } }
        p { font-size: 1rem; letter-spacing: 5px; text-transform: uppercase; color: #444; margin-top: 40px; font-weight: 700; }
        .line { width: 1px; height: 100px; background: linear-gradient(to bottom, #fff, transparent); margin: 40px auto; }
    </style>
</head>
<body>
    <div class="bg-shadow"></div>
    <div class="content">
        <p>MonoApps Digital Atelier</p>
        <h1>The<br>Shadow.</h1>
        <div class="line"></div>
        <p style="font-size: 0.7rem; color: #333;">EST. 2026 / SEOUL</p>
    </div>
</body>
</html>
