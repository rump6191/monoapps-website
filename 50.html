<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Terminal Final</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: #3b82f6; font-family: 'JetBrains Mono', monospace; padding: 40px; box-sizing: border-box; overflow: hidden; height: 100vh; }
        .hud-border { position: fixed; top: 20px; left: 20px; right: 20px; bottom: 20px; border: 1px solid rgba(59,130,246,0.3); pointer-events: none; }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 4rem; font-size: 0.8rem; }
        .main { border-left: 1px solid #3b82f6; padding-left: 40px; }
        h1 { font-size: 5rem; margin: 0; letter-spacing: -5px; font-weight: 300; }
        .status { display: flex; gap: 20px; margin-top: 2rem; }
        .dot { width: 10px; height: 10px; background: #3b82f6; border-radius: 50%; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 6rem; }
        .box { border: 1px solid rgba(59,130,246,0.2); padding: 20px; transition: 0.3s; }
        .box:hover { background: rgba(59,130,246,0.1); border-color: #3b82f6; }
        .num { font-size: 0.7rem; margin-bottom: 10px; opacity: 0.5; }
        h3 { margin: 0; font-size: 1.2rem; }
        
        .footer { position: fixed; bottom: 40px; right: 40px; text-align: right; }
    </style>
</head>
<body>
    <div class="hud-border"></div>
    <div class="top-bar">
        <div>MONOAPPS // CORE_OS_v5.0</div>
        <div>LATENCY: 0.001ms // UPTIME: 99.99%</div>
    </div>
    
    <div class="main">
        <h1>MONO_SYSTEMS</h1>
        <div class="status">
            <div class="dot"></div>
            <span>ALL SYSTEMS OPERATIONAL</span>
        </div>
        
        <div class="grid">
            <div class="box"><div class="num">ID_01</div><h3>QR_DECODER</h3></div>
            <div class="box"><div class="num">ID_02</div><h3>DATA_ANALYSIS</h3></div>
            <div class="box"><div class="num">ID_03</div><h3>SUBCONSCIOUS_AI</h3></div>
        </div>
    </div>
    
    <div class="footer">
        <div>© 2026 MONOAPPS CORP.</div>
        <div style="font-size: 0.7rem; opacity: 0.5;">DECODING THE FUTURE...</div>
    </div>
</body>
</html>
