<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Newspaper</title>
    <style>
        body { background: #e5e5e5; padding: 40px; font-family: 'Georgia', serif; color: #333; }
        .paper { background: #f4f1ea; max-width: 800px; margin: 0 auto; padding: 40px; border: 1px solid #ccc; box-shadow: 10px 10px 0 rgba(0,0,0,0.1); }
        h1 { font-size: 4rem; text-align: center; border-bottom: 5px double #000; margin-bottom: 10px; text-transform: uppercase; }
        .date { text-align: center; border-bottom: 1px solid #000; padding-bottom: 10px; margin-bottom: 20px; font-weight: bold; }
        .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        h2 { font-size: 1.5rem; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="paper">
        <h1>MonoApps News</h1>
        <div class="date">SEOUL, SATURDAY, JANUARY 10, 2026</div>
        <div class="cols">
            <div>
                <h2>QR Pro Released!</h2>
                <p>가장 빠른 스캐너가 드디어 출시되었습니다. 이제 누구나 무료로 고속 스캔을 즐길 수 있습니다.</p>
            </div>
            <div>
                <h2>Digital Era</h2>
                <p>단순함의 가치를 연구하는 MonoApps 스튜디오. 우리는 다음 세대의 도구를 만듭니다.</p>
            </div>
        </div>
    </div>
</body>
</html>
