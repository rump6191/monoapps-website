<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Grid White</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #fff; font-family: 'Space Grotesk', sans-serif; display: grid; grid-template-columns: repeat(12, 1fr); min-height: 100vh; border: 4px solid #000; }
        .cell { border: 2px solid #000; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
        .header { grid-column: span 12; height: 100px; font-size: 2rem; background: #000; color: #fff; }
        .hero { grid-column: span 8; grid-row: span 2; font-size: 6rem; line-height: 0.9; }
        .side { grid-column: span 4; background: #ffff00; font-size: 1.5rem; }
        .item { grid-column: span 4; transition: 0.2s; cursor: pointer; }
        .item:hover { background: #000; color: #fff; }
        h2 { margin: 0; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="cell header">MONOAPPS // INDEX</div>
    <div class="cell hero">CORE<br>UTILITY<br>FOR ALL.</div>
    <div class="cell side">WE BUILD FAST.<br>WE BUILD PURE.</div>
    <div class="cell side" style="background:#00f3ff;">2026<br>EDITION</div>
    <div class="cell item"><h2>01 QR Pro</h2></div>
    <div class="cell item"><h2>02 Innov</h2></div>
    <div class="cell item"><h2>03 Dream</h2></div>
</body>
</html>
