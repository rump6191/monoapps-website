<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps - Red</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: #ff003c; font-family: 'Chakra Petch', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; background-image: linear-gradient(#ff003c 1px, transparent 1px); background-size: 100% 50px; }
        .panel { border: 2px solid #ff003c; padding: 40px; background: rgba(0,0,0,0.9); box-shadow: 0 0 20px #ff003c; position: relative; }

        h1 { font-size: 4rem; margin: 0; text-transform: uppercase; letter-spacing: 5px; }
        .btn { display: block; margin-top: 30px; background: #ff003c; color: #000; text-align: center; padding: 15px; text-decoration: none; font-size: 1.5rem; transition: 0.2s; }
        .btn:hover { background: #fff; color: #ff003c; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>MonoApps<br>Corp.</h1>
        <a href="#" class="btn">ENTER SYSTEM</a>
    </div>
</body>
</html>
