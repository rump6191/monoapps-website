<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>MonoApps 95</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        body { background: #008080; font-family: 'VT323', monospace; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .window {
            width: 800px; background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; box-shadow: 4px 4px 0 rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }
        
        .title-bar {
            background: #000080; color: white; padding: 4px 8px; display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem;
        }
        
        .btn-close {
            background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; width: 20px; height: 20px; text-align: center; line-height: 16px; font-weight: bold; cursor: pointer; color: black; font-family: sans-serif;
        }
        
        .content { padding: 20px; }
        
        .menu-bar { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #808080; padding-bottom: 5px; }
        .menu-item { cursor: pointer; }
        .menu-item::first-letter { text-decoration: underline; }
        
        .hero { text-align: center; margin-bottom: 30px; border: 2px inset #fff; padding: 20px; background: white; }
        h1 { font-size: 3rem; margin: 0 0 10px 0; }
        
        .icon-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        
        .icon-item { text-align: center; cursor: pointer; }
        .icon-img { width: 48px; height: 48px; background: #fff; margin: 0 auto 5px; border: 1px solid #000; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .icon-label { background: #000080; color: white; display: inline-block; padding: 2px 4px; font-size: 1.1rem; border: 1px dotted white; }
        
        .taskbar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 40px; background: #c0c0c0; border-top: 2px solid #fff;
            display: flex; align-items: center; padding: 2px;
        }
        .start-btn {
            height: 32px; padding: 0 10px; background: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff;
            font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 5px; box-shadow: 2px 2px 0 #000;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
            <span>MonoApps_Explorer.exe</span>
            <button class="btn-close">X</button>
        </div>
        
        <div class="content">
            <div class="menu-bar">
                <span class="menu-item">File</span>
                <span class="menu-item">Edit</span>
                <span class="menu-item">View</span>
                <span class="menu-item">Help</span>
            </div>
            
            <div class="hero">
                <h1>Welcome to MonoApps</h1>
                <p>Loading essential digital tools... [100%]</p>
            </div>
            
            <div class="icon-grid">
                <div class="icon-item">
                    <div class="icon-img">📷</div>
                    <span class="icon-label">QR_Scan</span>
                </div>
                <div class="icon-item">
                    <div class="icon-img">🛒</div>
                    <span class="icon-label">21_Innov</span>
                </div>
                <div class="icon-item">
                    <div class="icon-img">🌙</div>
                    <span class="icon-label">Dream_DB</span>
                </div>
            </div>
        </div>
        
        <div style="padding: 5px; border-top: 1px solid #808080; margin-top: 20px; font-size: 1rem;">
            3 object(s) selected
        </div>
    </div>
    
    <div class="taskbar">
        <button class="start-btn">🪟 Start</button>
        <div style="margin-left: 10px; padding: 5px; border: 2px inset #fff; background: #c0c0c0;">MonoApps - Active</div>
        <div style="margin-left: auto; padding: 5px 10px; border: 2px inset #fff; font-size: 1rem;">PM 2:26</div>
    </div>
</body>
</html>
